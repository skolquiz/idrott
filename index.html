<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idrott och hälsa</title>
<style>
  :root { --bg: #ECEFE9; --ink: #19212E; --muted: #586374; --card: #FFFFFF; --line: #D2D9CF; --accent: #2F5E3A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111612; --ink: #E6EAF0; --muted: #9AA5B5; --card: #1A211C; --line: #2A3441; --accent: #A9D3B2; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 40px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 2rem; }
  p { margin: 0; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a { display: grid; gap: 4px; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; }
  a:hover, a:focus-visible { border-color: var(--accent); }
  a b { font-size: 1.15rem; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Idrott och hälsa</h1>
  <p>Material att plugga med.</p>
  <ul>
    <li><a href="allemansratten-kartan/"><b>Allemansrätten och kartan</b><span>Allemansrättens regler och orienteringskartans tecken, med tester.</span></a></li>
  </ul>
</main>
</body>
</html>
